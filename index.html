<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мессенджер</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 10px; }
        #messages { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .msg { margin-bottom: 8px; }
        .msg strong { color: #333; }
        .msg span { color: #666; font-size: 0.8em; margin-left: 5px; }
        .input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <h2>Мессенджер</h2>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Имя..." value="Гость">
        <input type="text" id="messageInput" placeholder="Сообщение...">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3000');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const userInput = document.getElementById('userInput');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            const time = new Date(data.timestamp).toLocaleTimeString();
            messagesDiv.innerHTML += `<div class="msg"><strong>${data.user}:</strong> ${data.text} <span>${time}</span></div>`;
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        };

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            ws.send(JSON.stringify({ user: userInput.value || 'Аноним', text: text }));
            messageInput.value = '';
        }

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('Service Worker зарегистрирован'))
      .catch((err) => console.log('Ошибка SW:', err));
  }
</script>
</body>
</html>
